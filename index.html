<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Messenger</title>
<style>
  :root { --blue-2: #2a68c4; --blue-dark: #1b4f9c; --sky: #e4effc; --line: #b9cfec; --ink: #1d2b3f; --muted: #6b7c93; --link: #1a55b0; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; overflow: hidden; }
  body { font-family: Tahoma, Verdana, "Segoe UI", sans-serif; font-size: 14px; color: var(--ink); background: linear-gradient(160deg, #cfe2fa, #f2f7fd 55%, #d7e7fb); display: flex; align-items: center; justify-content: center; padding: 12px; }
  button { font: inherit; color: inherit; }
  .window { width: 100%; max-width: 940px; height: 100%; max-height: 740px; display: flex; flex-direction: column; background: #fff; border: 1px solid var(--blue-dark); border-radius: 8px 8px 4px 4px; box-shadow: 0 8px 28px rgba(27,79,156,.3); overflow: hidden; }
  .titlebar { background: linear-gradient(#78b2f6, var(--blue-2)); color: #fff; padding: 7px 12px; font-weight: bold; text-shadow: 0 1px 1px rgba(0,0,0,.35); display: flex; justify-content: space-between; }
  .titlebar small { font-weight: normal; opacity: .9; }
  .body { flex: 1; display: grid; grid-template-columns: 250px 1fr; min-height: 0; position: relative; }

  aside { background: var(--sky); border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
  .me { padding: 10px 12px; display: flex; gap: 10px; align-items: center; border-bottom: 1px solid var(--line); background: linear-gradient(#f4f9ff, var(--sky)); }
  .me .who { min-width: 0; flex: 1; display: flex; flex-direction: column; gap: 4px; }
  #meName { background: none; border: 0; padding: 0; font-weight: bold; color: var(--link); text-align: left; cursor: pointer; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #status { font: inherit; font-size: 12.5px; border: 1px solid var(--line); border-radius: 3px; padding: 2px; background: #fff; max-width: 100%; }
  .sec { display: flex; justify-content: space-between; align-items: center; padding: 8px 12px 3px; font-size: 12.5px; font-weight: bold; color: var(--muted); }
  .sec button { background: none; border: 0; color: var(--link); cursor: pointer; font-weight: bold; font-size: 12.5px; }
  .sec button:hover { text-decoration: underline; }
  aside ul { list-style: none; margin: 0; padding: 0 6px 6px; overflow-y: auto; flex: 1 1 0; min-height: 0; }
  .hint { color: var(--muted); font-size: 12.5px; padding: 4px 6px; }
  .item { width: 100%; display: flex; align-items: center; gap: 8px; padding: 5px 6px; border: 0; border-radius: 4px; background: none; cursor: pointer; text-align: left; }
  .item:hover { background: #fff; }
  .item.on { background: #fff; box-shadow: inset 3px 0 0 var(--blue-2); }
  .item.unread .nm { font-weight: bold; }
  .item:focus-visible, .btn:focus-visible, .sec button:focus-visible { outline: 2px solid #ffb400; outline-offset: 1px; }
  .item .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .badge { background: #e0342b; color: #fff; border-radius: 10px; padding: 0 7px; font-size: 12px; font-weight: bold; min-width: 20px; text-align: center; }
  .av { width: 34px; height: 34px; flex: none; border: 1px solid var(--line); border-radius: 4px; background: #fff; display: inline-flex; align-items: center; justify-content: center; font-size: 22px; overflow: hidden; }
  .av.sm { width: 28px; height: 28px; font-size: 18px; }
  .av img { width: 100%; height: 100%; object-fit: cover; display: block; }
  button.av { padding: 0; cursor: pointer; }
  button.av:hover { border-color: var(--blue-2); }

  main { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
  .head { padding: 8px 12px; border-bottom: 1px solid var(--line); background: linear-gradient(#f9fbff, #e9f1fc); display: flex; gap: 8px; align-items: center; }
  .head .t { min-width: 0; }
  #chatTitle { font-weight: bold; font-size: 15px; color: var(--link); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #chatSub { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #menuBtn { display: none; }
  #messages { flex: 1; overflow-y: auto; padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; }
  .empty { margin: auto; color: var(--muted); text-align: center; }
  .row { display: flex; gap: 8px; align-items: flex-start; }
  .row .txt { min-width: 0; }
  .row .nm2 { color: var(--link); font-weight: bold; }
  .row .nm2 span { font-weight: normal; color: var(--muted); }
  .row .c { white-space: pre-wrap; overflow-wrap: anywhere; line-height: 1.4; }
  .row img.pic { display: block; margin-top: 4px; max-width: 100%; max-height: 260px; border: 1px solid var(--line); border-radius: 4px; cursor: zoom-in; }
  .sys { color: var(--muted); font-style: italic; font-size: 13px; text-align: center; }

  form { display: flex; gap: 6px; padding: 10px; border-top: 1px solid var(--line); background: var(--sky); }
  form input[type="text"] { flex: 1; min-width: 0; border: 1px solid var(--line); border-radius: 3px; padding: 8px 10px; font: inherit; }
  input[type="text"]:focus { outline: 2px solid var(--blue-2); }
  .btn { border: 1px solid var(--blue-dark); border-radius: 3px; padding: 0 12px; min-height: 36px; cursor: pointer; color: #fff; background: linear-gradient(#7ab5f7, var(--blue-2)); }
  .btn.alt { color: var(--ink); border-color: #8fabd3; background: linear-gradient(#fff, #dbe7f7); }
  .btn:hover { filter: brightness(1.06); }
  .btn:disabled, input:disabled { opacity: .55; cursor: default; }

  #toast { position: fixed; left: 50%; bottom: 76px; transform: translateX(-50%); background: #1d2b3f; color: #fff; padding: 9px 14px; border-radius: 6px; font-size: 13px; opacity: 0; pointer-events: none; transition: opacity .2s; max-width: 90vw; text-align: center; z-index: 40; }
  #toast.show { opacity: 1; }
  #nudgeAlert { position: fixed; top: 18px; left: 50%; transform: translateX(-50%) scale(.9); background: #fff7d6; border: 2px solid #e0a800; color: #6b4b00; padding: 12px 22px; border-radius: 8px; font-weight: bold; font-size: 16px; box-shadow: 0 6px 20px rgba(0,0,0,.25); opacity: 0; pointer-events: none; transition: opacity .15s, transform .15s; z-index: 40; max-width: 92vw; text-align: center; }
  #nudgeAlert.show { opacity: 1; transform: translateX(-50%) scale(1); }
  @keyframes shake {
    0%, 100% { transform: translate(0,0) rotate(0); }
    10% { transform: translate(-16px,5px) rotate(-1.2deg); } 20% { transform: translate(14px,-6px) rotate(1deg); }
    30% { transform: translate(-12px,-4px) rotate(-1deg); } 40% { transform: translate(12px,6px) rotate(1.2deg); }
    50% { transform: translate(-10px,3px) rotate(-.8deg); } 60% { transform: translate(10px,-4px) rotate(.8deg); }
    70% { transform: translate(-6px,4px) rotate(-.5deg); } 80% { transform: translate(6px,-2px) rotate(.4deg); } 90% { transform: translate(-3px,1px); }
  }
  @keyframes flash { 50% { background: #fff3c4; } }
  .window.nudging { animation: shake .9s ease-in-out; }
  @media (prefers-reduced-motion: reduce) { .window.nudging { animation: flash .9s ease-in-out 1; } }

  dialog { border: 1px solid var(--blue-dark); border-radius: 8px; padding: 0; width: min(360px, 92vw); color: var(--ink); }
  dialog::backdrop { background: rgba(20,40,80,.45); }
  dialog .hd { background: linear-gradient(#78b2f6, var(--blue-2)); color: #fff; font-weight: bold; padding: 7px 12px; }
  dialog .bd { padding: 12px; display: flex; flex-direction: column; gap: 10px; }
  dialog label { font-size: 13px; color: var(--muted); display: flex; flex-direction: column; gap: 4px; }
  dialog input[type="text"] { border: 1px solid var(--line); border-radius: 3px; padding: 7px 9px; font: inherit; color: var(--ink); }
  #emojiGrid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
  #emojiGrid .av { width: 100%; height: 46px; font-size: 26px; }
  #pick { max-height: 160px; overflow-y: auto; border: 1px solid var(--line); border-radius: 3px; padding: 4px 8px; }
  #pick label { flex-direction: row; align-items: center; gap: 8px; color: var(--ink); padding: 3px 0; }
  dialog .acts { display: flex; gap: 8px; justify-content: space-between; }
  #lightbox { position: fixed; inset: 0; background: rgba(0,0,0,.85); display: none; align-items: center; justify-content: center; padding: 20px; cursor: zoom-out; z-index: 50; }
  #lightbox.open { display: flex; }
  #lightbox img { max-width: 100%; max-height: 100%; border-radius: 6px; }

  @media (max-width: 680px) {
    body { padding: 0; }
    .window { max-height: none; border-radius: 0; }
    .body { grid-template-columns: 1fr; }
    aside { position: absolute; inset: 0 auto 0 0; width: 86%; z-index: 10; transform: translateX(-102%); transition: transform .2s; }
    aside.open { transform: none; box-shadow: 6px 0 20px rgba(0,0,0,.25); }
    #menuBtn { display: inline-block; min-height: 32px; }
  }
</style>
</head>
<body>
<div class="window" id="win">
  <div class="titlebar"><span>Mi Messenger</span><small id="count">Conectando…</small></div>
  <div class="body">
    <aside id="side">
      <div class="me">
        <button class="av" id="meAvatar" type="button" title="Cambiar avatar" aria-label="Cambiar avatar"></button>
        <div class="who">
          <button id="meName" type="button" title="Cambiar nombre"></button>
          <select id="status" aria-label="Estado">
            <option value="online">🟢 Disponible</option>
            <option value="away">🟡 Ausente</option>
            <option value="busy">🔴 Ocupado</option>
          </select>
        </div>
      </div>
      <div class="sec"><span>Chats</span><button id="newGroup" type="button">+ Grupo</button></div>
      <ul id="chatList"></ul>
      <div class="sec"><span id="onlineTitle">En línea</span></div>
      <ul id="users"></ul>
    </aside>

    <main>
      <div class="head">
        <button class="btn alt" id="menuBtn" type="button" aria-label="Mostrar chats">☰</button>
        <div class="t"><div id="chatTitle">Messenger</div><div id="chatSub">Elige un usuario o un chat</div></div>
      </div>
      <div id="messages" aria-live="polite"></div>
      <form id="form" autocomplete="off">
        <button class="btn alt" id="imgBtn" type="button" title="Subir imagen o meme">Imagen</button>
        <input type="file" id="file" accept="image/*" hidden>
        <button class="btn alt" id="nudgeBtn" type="button" title="Enviar un zumbido">🔔 Zumbido</button>
        <input type="text" id="text" placeholder="Escribe un mensaje" maxlength="1000" aria-label="Mensaje">
        <button class="btn" id="sendBtn" type="submit">Enviar</button>
      </form>
    </main>
  </div>
</div>

<dialog id="avatarDlg">
  <div class="hd">Elige tu avatar</div>
  <div class="bd">
    <div id="emojiGrid"></div>
    <div class="acts">
      <button class="btn alt" id="avatarUpload" type="button">Subir foto</button>
      <button class="btn" id="avatarClose" type="button">Cerrar</button>
    </div>
    <input type="file" id="avatarFile" accept="image/*" hidden>
  </div>
</dialog>

<dialog id="groupDlg">
  <div class="hd">Crear grupo</div>
  <div class="bd">
    <label>Nombre del grupo<input type="text" id="gName" maxlength="40"></label>
    <div>
      <div class="hint" style="padding:0 0 4px">Miembros</div>
      <div id="pick"></div>
    </div>
    <label>Otro usuario (nombre exacto, opcional)<input type="text" id="gExtra" maxlength="24"></label>
    <div class="acts">
      <button class="btn alt" id="gCancel" type="button">Cancelar</button>
      <button class="btn" id="gCreate" type="button">Crear</button>
    </div>
  </div>
</dialog>

<div id="toast" role="status"></div>
<div id="nudgeAlert" role="alert"></div>
<div id="lightbox"><img alt=""></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
  // ====== CONFIGURACIÓN ======
  const SUPABASE_URL = "https://TU-PROYECTO.supabase.co";
  const SUPABASE_ANON_KEY = "TU-ANON-KEY";
  const BUCKET = "memes";
  const MAX_MB = 5;
  const NUDGE_COOLDOWN_MS = 10000;
  // Opcional: URLs de audio (mp3/ogg) para reemplazar los sonidos sintetizados.
  const SOUND_URLS = { message: "", online: "", nudge: "" };
  // ===========================

  const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  const $ = (id) => document.getElementById(id);
  const STATUS = { online: "🟢", away: "🟡", busy: "🔴" };
  const STATUS_TXT = { online: "Disponible", away: "Ausente", busy: "Ocupado" };
  const EMOJIS = ["🐱","🐶","🦊","🐼","🐸","🐵","🦄","🐙","👻","🤖","👽","💀","🌸","⭐","🔥","🍕","🎸","🎮","😎","🥷"];
  const store = {
    get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  };

  // ---------- Perfil ----------
  const me = {
    key: crypto.randomUUID ? crypto.randomUUID() : String(Math.random()).slice(2),
    name: store.get("chat_username"),
    avatar: store.get("chat_avatar") || EMOJIS[Math.floor(Math.random() * EMOJIS.length)],
    status: "online"
  };
  function askName() {
    const old = me.name;
    const n = (prompt("¿Cómo te llamas?", me.name || "") || "").replace(/\|/g, "").trim().slice(0, 24);
    if (n) { me.name = n; store.set("chat_username", n); }
    if (!me.name) me.name = "Anónimo";
    if (old && old !== me.name) return location.reload(); // tu identidad cambió: recarga limpia
    $("meName").textContent = me.name;
    pushPresence();
  }
  function fill(el, av) {
    el.textContent = "";
    if (av && /^https?:/.test(av)) { const i = document.createElement("img"); i.src = av; i.alt = ""; el.appendChild(i); }
    else el.textContent = av || "👤";
  }
  function avatarEl(av, small) {
    const s = document.createElement("span");
    s.className = "av" + (small ? " sm" : "");
    fill(s, av);
    return s;
  }

  let toastTimer;
  function toast(msg) {
    const t = $("toast");
    t.textContent = msg; t.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove("show"), 3500);
  }

  // ---------- Sonidos ----------
  let ctx = null;
  function unlockAudio() {
    try { ctx = ctx || new (window.AudioContext || window.webkitAudioContext)(); if (ctx.state === "suspended") ctx.resume(); } catch (e) {}
  }
  ["pointerdown", "keydown"].forEach((ev) => document.addEventListener(ev, unlockAudio));
  function beep(freq, at, dur, type, vol) {
    const o = ctx.createOscillator(), g = ctx.createGain(), t0 = ctx.currentTime + at;
    o.type = type || "sine"; o.frequency.value = freq;
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(vol || 0.2, t0 + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g).connect(ctx.destination);
    o.start(t0); o.stop(t0 + dur + 0.02);
  }
  const SYNTH = {
    message() { beep(880, 0, 0.12); beep(1175, 0.11, 0.2); },
    online() { beep(523, 0, 0.12); beep(659, 0.11, 0.12); beep(784, 0.22, 0.12); beep(1047, 0.33, 0.25); },
    nudge() { for (let i = 0; i < 8; i++) beep(i % 2 ? 140 : 190, i * 0.09, 0.08, "square", 0.12); }
  };
  function play(name) {
    try {
      if (SOUND_URLS[name]) { new Audio(SOUND_URLS[name]).play().catch(() => {}); return; }
      if (ctx) SYNTH[name]();
    } catch (e) {}
  }

  // ---------- Estado de chats ----------
  let chats = new Map();         // id -> {id, name, is_group, dm_key, members[], last}
  let current = null;            // chat abierto
  const unread = new Map();      // id -> {count, nudge}
  const profiles = new Map();    // nombre -> avatar (presencia)
  const statusOf = new Map();    // nombre -> estado (solo conectados)
  let loadTok = 0;

  const otherName = (c) => (c.dm_key || "").split("|").find((n) => n !== me.name) || me.name;
  const chatTitle = (c) => (c.is_group ? c.name : otherName(c));

  async function loadChats() {
    const mem = await db.from("chat_members").select("chat_id").eq("username", me.name);
    if (mem.error) return toast("No se pudieron cargar tus chats: " + mem.error.message);
    const ids = mem.data.map((r) => r.chat_id);
    if (!ids.length) { chats = new Map(); return refreshUI(); }
    const [cs, ms] = await Promise.all([
      db.from("chats").select("*").in("id", ids),
      db.from("chat_members").select("chat_id,username").in("chat_id", ids)
    ]);
    if (cs.error || ms.error) return toast("Error al cargar chats: " + (cs.error || ms.error).message);
    const next = new Map();
    cs.data.forEach((c) => {
      const old = chats.get(c.id);
      next.set(c.id, { ...c, members: [], last: old ? old.last : Date.parse(c.created_at) || 0 });
    });
    ms.data.forEach((r) => { const c = next.get(r.chat_id); if (c) c.members.push(r.username); });
    chats = next;
    refreshUI();
  }

  function bump(id, nudge) {
    const u = unread.get(id) || { count: 0, nudge: false };
    u.count++; if (nudge) u.nudge = true;
    unread.set(id, u);
  }

  // ---------- Pintado de la barra lateral ----------
  function listItem(ul, { avatar, label, extra, on, unreadFlag, onClick }) {
    const li = document.createElement("li");
    const b = document.createElement("button");
    b.type = "button";
    b.className = "item" + (on ? " on" : "") + (unreadFlag ? " unread" : "");
    b.appendChild(avatar);
    const n = document.createElement("span");
    n.className = "nm"; n.textContent = label;
    b.appendChild(n);
    if (extra) b.appendChild(extra);
    if (onClick) b.addEventListener("click", onClick);
    li.appendChild(b);
    ul.appendChild(li);
  }
  function hint(ul, text) {
    const li = document.createElement("li");
    li.className = "hint"; li.textContent = text;
    ul.appendChild(li);
  }
  function txt(s) { const e = document.createElement("span"); e.textContent = s; return e; }

  function renderChats() {
    const ul = $("chatList");
    ul.textContent = "";
    const arr = [...chats.values()].sort((a, b) => b.last - a.last);
    if (!arr.length) hint(ul, "Aún no tienes chats. Haz clic en un usuario en línea.");
    let total = 0;
    arr.forEach((c) => {
      const u = unread.get(c.id);
      if (u) total += u.count;
      const o = c.is_group ? null : otherName(c);
      let extra = null;
      if (u || o) {
        extra = document.createElement("span");
        if (o) extra.appendChild(txt(statusOf.has(o) ? STATUS[statusOf.get(o)] : "⚪"));
        if (u) {
          const bd = document.createElement("span");
          bd.className = "badge"; bd.style.marginLeft = "6px";
          bd.textContent = (u.nudge ? "🔔 " : "") + u.count;
          bd.title = "Mensajes sin leer";
          extra.appendChild(bd);
        }
      }
      listItem(ul, {
        avatar: avatarEl(c.is_group ? "👥" : profiles.get(o), true),
        label: chatTitle(c), extra, on: c.id === current, unreadFlag: !!u,
        onClick: () => openChat(c.id)
      });
    });
    document.title = (total ? "(" + total + ") " : "") + "Messenger";
  }

  function renderUsers() {
    const state = room.presenceState();
    const byName = new Map();
    Object.keys(state).forEach((k) => { const p = state[k][0]; if (p && p.name) byName.set(p.name, p); });
    profiles.clear(); statusOf.clear();
    const ul = $("users");
    ul.textContent = "";
    [...byName.values()].sort((a, b) => a.name.localeCompare(b.name)).forEach((u) => {
      profiles.set(u.name, u.avatar); statusOf.set(u.name, u.status || "online");
      const self = u.name === me.name;
      listItem(ul, {
        avatar: avatarEl(u.avatar, true),
        label: u.name + (self ? " (tú)" : ""),
        extra: txt(STATUS[u.status] || STATUS.online),
        onClick: self ? null : () => openDm(u.name)
      });
    });
    $("onlineTitle").textContent = "En línea (" + byName.size + ")";
    $("count").textContent = byName.size + (byName.size === 1 ? " conectado" : " conectados");
  }

  function updateHeader() {
    const c = chats.get(current);
    if (!c) { $("chatTitle").textContent = "Messenger"; $("chatSub").textContent = "Elige un usuario o un chat"; return; }
    $("chatTitle").textContent = (c.is_group ? "👥 " : "") + chatTitle(c);
    if (c.is_group) $("chatSub").textContent = c.members.length + " miembros: " + c.members.join(", ");
    else { const o = otherName(c); $("chatSub").textContent = statusOf.has(o) ? STATUS[statusOf.get(o)] + " " + STATUS_TXT[statusOf.get(o)] : "⚪ Desconectado"; }
  }
  function refreshUI() { renderChats(); updateHeader(); }

  function setComposer(on) {
    ["text", "sendBtn", "imgBtn", "nudgeBtn"].forEach((id) => { $(id).disabled = !on; });
  }

  // ---------- Panel de mensajes ----------
  const list = $("messages");
  const seen = new Set();
  function resetList(msg) {
    seen.clear(); list.textContent = "";
    if (msg) { const p = document.createElement("p"); p.className = "empty"; p.textContent = msg; list.appendChild(p); }
  }
  function dropEmpty() { const e = list.querySelector(".empty"); if (e) e.remove(); }

  function render(m) {
    if (seen.has(m.id)) return;
    seen.add(m.id); dropEmpty();
    const row = document.createElement("div");
    row.className = "row";
    row.appendChild(avatarEl(m.avatar || profiles.get(m.username), true));
    const t = document.createElement("div");
    t.className = "txt";
    const nm = document.createElement("div");
    nm.className = "nm2"; nm.textContent = m.username + " ";
    const d = document.createElement("span"); d.textContent = "dice:";
    nm.appendChild(d); t.appendChild(nm);
    if (m.content) { const c = document.createElement("div"); c.className = "c"; c.textContent = m.content; t.appendChild(c); }
    if (m.image_url) {
      const img = document.createElement("img");
      img.className = "pic"; img.src = m.image_url; img.loading = "lazy";
      img.alt = "Imagen enviada por " + m.username;
      img.addEventListener("click", () => { $("lightbox").querySelector("img").src = m.image_url; $("lightbox").classList.add("open"); });
      t.appendChild(img);
    }
    row.appendChild(t);
    list.appendChild(row);
    list.scrollTop = list.scrollHeight;
  }
  function sysLine(text) {
    dropEmpty();
    const p = document.createElement("div");
    p.className = "sys"; p.textContent = text;
    list.appendChild(p);
    list.scrollTop = list.scrollHeight;
  }
  $("lightbox").addEventListener("click", () => $("lightbox").classList.remove("open"));

  async function openChat(id) {
    current = id;
    unread.delete(id);
    refreshUI();
    setComposer(true);
    $("side").classList.remove("open");
    resetList("Cargando…");
    const tok = ++loadTok;
    const { data, error } = await db.from("messages").select("*").eq("chat_id", id).order("created_at", { ascending: false }).limit(100);
    if (tok !== loadTok) return;
    if (error) { resetList("No se pudo cargar el historial."); return toast(error.message); }
    resetList(data.length ? "" : "Sin mensajes todavía. ¡Saluda!");
    data.reverse().forEach(render);
    $("text").focus();
  }

  async function openDm(other) {
    const key = [me.name, other].sort().join("|");
    let c = [...chats.values()].find((x) => x.dm_key === key);
    if (!c) {
      const ins = await db.from("chats").upsert({ is_group: false, dm_key: key, created_by: me.name }, { onConflict: "dm_key", ignoreDuplicates: true });
      if (ins.error) return toast("No se pudo crear el chat: " + ins.error.message);
      const got = await db.from("chats").select("id").eq("dm_key", key).single();
      if (got.error) return toast("No se pudo abrir el chat: " + got.error.message);
      const mm = await db.from("chat_members").upsert(
        [{ chat_id: got.data.id, username: me.name }, { chat_id: got.data.id, username: other }],
        { onConflict: "chat_id,username", ignoreDuplicates: true });
      if (mm.error) return toast("No se pudieron añadir los miembros: " + mm.error.message);
      await loadChats();
      c = chats.get(got.data.id);
    }
    if (c) openChat(c.id);
  }

  // ---------- Mensajes en tiempo real (todos tus chats) ----------
  async function onNewMessage(m) {
    let c = chats.get(m.chat_id);
    if (!c) { await loadChats(); c = chats.get(m.chat_id); }
    if (!c) return; // no es un chat tuyo
    c.last = Date.now();
    if (m.chat_id === current) render(m);
    if (m.username !== me.name) {
      play("message");
      if (m.chat_id !== current) bump(m.chat_id, false);
    }
    renderChats();
  }
  db.channel("db-changes")
    .on("postgres_changes", { event: "INSERT", schema: "public", table: "messages" }, (p) => onNewMessage(p.new))
    .on("postgres_changes", { event: "INSERT", schema: "public", table: "chat_members" }, (p) => { if (p.new.username === me.name) loadChats(); })
    .subscribe();

  let warnedAvatar = false;
  async function insertMsg(row) {
    row.chat_id = current;
    let r = await db.from("messages").insert({ ...row, avatar: me.avatar });
    if (r.error && /avatar/i.test(r.error.message || "")) {
      r = await db.from("messages").insert(row);
      if (!r.error && !warnedAvatar) { warnedAvatar = true; toast("Para guardar avatares en el historial, añade la columna avatar a messages."); }
    }
    return r;
  }

  $("form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const content = $("text").value.trim();
    if (!content || !current) return;
    $("sendBtn").disabled = true;
    const { error } = await insertMsg({ username: me.name, content });
    $("sendBtn").disabled = false;
    if (error) return toast("No se pudo enviar: " + error.message);
    $("text").value = ""; $("text").focus();
  });

  async function uploadImage(file, folder) {
    const ext = (file.name.split(".").pop() || "png").toLowerCase().replace(/[^a-z0-9]/g, "");
    const path = (folder ? folder + "/" : "") + Date.now() + "-" + Math.random().toString(36).slice(2, 8) + "." + ext;
    const up = await db.storage.from(BUCKET).upload(path, file, { contentType: file.type });
    if (up.error) throw up.error;
    return db.storage.from(BUCKET).getPublicUrl(path).data.publicUrl;
  }
  function checkImage(file, maxMb) {
    if (!file.type.startsWith("image/")) { toast("Solo se pueden subir imágenes."); return false; }
    if (file.size > maxMb * 1024 * 1024) { toast("La imagen supera los " + maxMb + " MB."); return false; }
    return true;
  }
  $("imgBtn").addEventListener("click", () => $("file").click());
  $("file").addEventListener("change", async () => {
    const file = $("file").files[0];
    $("file").value = "";
    if (!file || !current || !checkImage(file, MAX_MB)) return;
    $("imgBtn").disabled = true; $("imgBtn").textContent = "Subiendo…";
    try {
      const r = await insertMsg({ username: me.name, image_url: await uploadImage(file) });
      if (r.error) throw r.error;
    } catch (err) { toast("No se pudo subir la imagen: " + err.message); }
    finally { $("imgBtn").disabled = !current; $("imgBtn").textContent = "Imagen"; }
  });

  // ---------- Presencia, estados y zumbido ----------
  const room = db.channel("lobby", { config: { presence: { key: me.key }, broadcast: { self: false } } });
  let subscribed = false, ready = false;

  function pushPresence() {
    $("meName").textContent = me.name || "";
    fill($("meAvatar"), me.avatar);
    if (subscribed) room.track({ name: me.name, avatar: me.avatar, status: me.status });
  }
  room
    .on("presence", { event: "sync" }, () => { renderUsers(); refreshUI(); ready = true; })
    .on("presence", { event: "join" }, ({ newPresences }) => {
      if (ready && newPresences.some((p) => p.name !== me.name)) play("online");
    })
    .on("broadcast", { event: "nudge" }, ({ payload }) => receiveNudge(payload))
    .subscribe((s) => { if (s === "SUBSCRIBED") { subscribed = true; pushPresence(); } });

  $("status").addEventListener("change", () => { me.status = $("status").value; pushPresence(); });

  let lastNudge = 0, alertTimer;
  function showAlert(text) {
    const a = $("nudgeAlert");
    a.textContent = text; a.classList.add("show");
    clearTimeout(alertTimer);
    alertTimer = setTimeout(() => a.classList.remove("show"), 3200);
  }
  function shake() {
    const w = $("win");
    w.classList.remove("nudging"); void w.offsetWidth; w.classList.add("nudging");
    setTimeout(() => w.classList.remove("nudging"), 1000);
  }
  $("nudgeBtn").addEventListener("click", () => {
    if (!current) return;
    const wait = NUDGE_COOLDOWN_MS - (Date.now() - lastNudge);
    if (wait > 0) return toast("Espera " + Math.ceil(wait / 1000) + " s para enviar otro zumbido.");
    if (!subscribed) return toast("Aún conectando, intenta de nuevo.");
    lastNudge = Date.now();
    room.send({ type: "broadcast", event: "nudge", payload: { name: me.name, chat_id: current } });
    sysLine("Has enviado un zumbido.");
    play("nudge"); shake();
  });
  function receiveNudge(p) {
    const c = p && chats.get(p.chat_id);
    if (!c) return; // zumbido de un chat que no es tuyo
    const who = String(p.name || "Alguien").slice(0, 24);
    play("nudge");
    if (p.chat_id === current) {
      shake();
      showAlert("🔔 ¡" + who + " te ha enviado un zumbido!");
      sysLine(who + " te ha enviado un zumbido.");
    } else {
      bump(p.chat_id, true);
      renderChats();
      showAlert("🔔 ¡" + who + " te ha enviado un zumbido en " + chatTitle(c) + "!");
    }
  }

  // ---------- Grupos ----------
  const gDlg = $("groupDlg");
  $("newGroup").addEventListener("click", () => {
    const names = new Set(statusOf.keys());
    chats.forEach((c) => c.members.forEach((m) => names.add(m)));
    names.delete(me.name);
    const pick = $("pick");
    pick.textContent = "";
    if (!names.size) hint(pick, "Aún no conoces a nadie. Usa el campo de abajo.");
    [...names].sort().forEach((n) => {
      const l = document.createElement("label");
      const cb = document.createElement("input");
      cb.type = "checkbox"; cb.value = n;
      l.append(cb, txt((statusOf.has(n) ? STATUS[statusOf.get(n)] : "⚪") + " " + n));
      pick.appendChild(l);
    });
    $("gName").value = ""; $("gExtra").value = "";
    gDlg.showModal();
  });
  $("gCancel").addEventListener("click", () => gDlg.close());
  $("gCreate").addEventListener("click", async () => {
    const name = $("gName").value.trim();
    const members = new Set([...$("pick").querySelectorAll("input:checked")].map((i) => i.value));
    const extra = $("gExtra").value.replace(/\|/g, "").trim();
    if (extra) members.add(extra);
    members.delete(me.name);
    if (!name) return toast("Ponle un nombre al grupo.");
    if (!members.size) return toast("Elige al menos un miembro.");
    $("gCreate").disabled = true;
    try {
      const c = await db.from("chats").insert({ name, is_group: true, created_by: me.name }).select().single();
      if (c.error) throw c.error;
      const rows = [me.name, ...members].map((u) => ({ chat_id: c.data.id, username: u }));
      const m = await db.from("chat_members").insert(rows);
      if (m.error) throw m.error;
      gDlg.close();
      await loadChats();
      openChat(c.data.id);
    } catch (err) { toast("No se pudo crear el grupo: " + err.message); }
    finally { $("gCreate").disabled = false; }
  });

  // ---------- Avatar ----------
  const dlg = $("avatarDlg");
  EMOJIS.forEach((e) => {
    const b = document.createElement("button");
    b.type = "button"; b.className = "av"; b.textContent = e;
    b.setAttribute("aria-label", "Avatar " + e);
    b.addEventListener("click", () => setAvatar(e));
    $("emojiGrid").appendChild(b);
  });
  function setAvatar(av) { me.avatar = av; store.set("chat_avatar", av); pushPresence(); dlg.close(); }
  $("meAvatar").addEventListener("click", () => dlg.showModal());
  $("avatarClose").addEventListener("click", () => dlg.close());
  $("avatarUpload").addEventListener("click", () => $("avatarFile").click());
  $("avatarFile").addEventListener("change", async () => {
    const file = $("avatarFile").files[0];
    $("avatarFile").value = "";
    if (!file || !checkImage(file, 2)) return;
    $("avatarUpload").disabled = true; $("avatarUpload").textContent = "Subiendo…";
    try { setAvatar(await uploadImage(file, "avatars")); }
    catch (err) { toast("No se pudo subir la foto: " + err.message); }
    finally { $("avatarUpload").disabled = false; $("avatarUpload").textContent = "Subir foto"; }
  });

  $("meName").addEventListener("click", askName);
  $("menuBtn").addEventListener("click", () => $("side").classList.toggle("open"));

  // ---------- Inicio ----------
  if (!me.name) askName(); else pushPresence();
  setComposer(false);
  resetList("Elige un usuario en línea o un chat para empezar.");
  loadChats();
</script>
</body>
</html>
